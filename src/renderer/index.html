<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Claude Code Manager</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="menu" id="sessions-menu">
      <button class="nav" id="btn-sessions">세션 ▾</button>
      <div class="flyout" id="flyout">
        <div class="flyout-bar"><input id="sess-search" placeholder="세션 필터 (이름 · 폴더 · 상태)  —  Enter: 전체 대화 본문 검색" autocomplete="off"><div id="version-bar"></div></div>
        <div id="search-results"></div>
        <div id="session-list"></div>
      </div>
    </div>
    <button class="tab-arrow" id="tabs-prev" hidden data-tip="이전 탭 보기">‹</button>
    <div id="tabs"></div>
    <button class="tab-arrow" id="tabs-next" hidden data-tip="다음 탭 보기">›</button>
    <div class="spacer"></div>
    <div class="menu" id="profile-menu">
      <button class="profile" id="btn-profile"><span class="avatar">?</span><span class="profile-text">계정…</span><span class="chev">⌄</span></button>
      <div class="flyout profile-pop" id="profile-pop"></div>
    </div>
    <button class="nav" id="btn-look" data-tip="앱 테마 · 터미널 색상/폰트/투명도"><svg viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.2 0 1.8-.7 1.8-1.5 0-.9-.8-1.3-.8-2.2 0-.9.8-1.6 1.8-1.6h1.6a4 4 0 0 0 4.1-4C20.5 7 16.7 3.5 12 3.5z"/><circle cx="8" cy="11" r="1.1" fill="currentColor" stroke="none"/><circle cx="11" cy="7.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.1" fill="currentColor" stroke="none"/></svg>모양</button>
    <button class="nav" id="btn-stats"><svg viewBox="0 0 24 24"><path d="M5 19.5V12M12 19.5V5M19 19.5v-9"/></svg>통계</button>
    <button class="nav" id="btn-memory"><svg viewBox="0 0 24 24"><rect x="4" y="4.5" width="16" height="15" rx="2.5"/><path d="M8 9.5h8M8 13h8M8 16.5h5"/></svg>메모리</button>
    <button id="btn-new"><svg viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></svg>새 세션</button>
    <button id="btn-refresh" data-tip="새로고침"><svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5V9H15"/></svg></button>
  </header>

  <main id="view-sessions" class="view">
    <section id="session-detail"><div class="empty">「세션 ▾」에서 세션을 고르면 탭으로 열립니다</div></section>
    <aside id="browser-pane" class="hidden">
      <div id="br-divider"></div>
      <div id="br-toolbar"></div>
      <div id="br-views"></div>
      <div id="br-chips"></div>
    </aside>
  </main>

  <main id="view-memory" class="view hidden">
    <aside id="memory-side">
      <input id="mem-search" placeholder="검색 (이름 · 설명 · 프로젝트)">
      <div class="row"><select id="mem-project"><option value="">모든 프로젝트</option></select><button id="btn-new-memory" data-tip="새 메모리 작성">＋</button></div>
      <div id="memory-list"></div>
    </aside>
    <section id="memory-detail"><div class="empty">메모리를 선택하세요</div></section>
  </main>

  <main id="view-stats" class="view hidden">
    <section id="stats-detail" class="pane stats-pane"></section>
  </main>

  <dialog id="dlg-new">
    <form method="dialog">
      <h3>새 세션</h3>
      <label>작업 폴더 <div class="row"><input id="new-cwd" readonly placeholder="폴더를 선택하세요"><button type="button" id="new-pick">선택…</button></div></label>
      <label hidden>프로파일 <select id="new-profile"></select></label>
      <label>실행 방식 <select id="new-mode">
        <option value="bg">백그라운드 세션 — 터미널 탭에서 진행 (claude --bg)</option>
        <option value="chat">챗 — 앱 안에서 대화 (SDK)</option>
      </select></label>
      <label>이름 <input id="new-name" placeholder="세션 이름 (선택)"></label>
      <div class="grid2">
        <label>모델 <input id="new-model" list="model-list" placeholder="기본값 (settings.json)" autocomplete="off">
          <datalist id="model-list">
            <option value="fable"></option><option value="fable[1m]"></option>
            <option value="opus"></option><option value="opus[1m]"></option>
            <option value="sonnet"></option><option value="haiku"></option>
            <option value="claude-fable-5-1[1m]"></option><option value="claude-opus-5-5"></option>
          </datalist></label>
        <label>Effort <select id="new-effort">
          <option value="">기본값</option><option>low</option><option>medium</option><option>high</option><option>xhigh</option><option>max</option>
        </select></label>
        <label>권한 모드 <select id="new-permission">
          <option value="">기본값</option><option>auto</option><option>acceptEdits</option><option>plan</option><option>manual</option><option>dontAsk</option><option>bypassPermissions</option>
        </select></label>
        <label>Agent <input id="new-agent" placeholder="claude (기본)" autocomplete="off"></label>
      </div>
      <label>첫 프롬프트 <textarea id="new-prompt" rows="3" placeholder="비워두면 터미널에서 직접 입력"></textarea></label>
      <p class="hint">백그라운드 세션(<code>claude --bg</code>)으로 띄운 뒤 바로 붙습니다. 폴더가 아직 신뢰되지 않았으면 터미널에서 바로 열어 신뢰 프롬프트를 받습니다.</p>
      <div class="row right"><button value="cancel">취소</button><button value="ok" id="new-ok">시작</button></div>
    </form>
  </dialog>

  <dialog id="dlg-memory">
    <form method="dialog">
      <h3>새 메모리</h3>
      <label>프로젝트 <select id="nm-project"></select></label>
      <div class="grid2">
        <label>이름 (파일명, 소문자-하이픈) <input id="nm-name" placeholder="예: deploy-order" autocomplete="off" required></label>
        <label>유형 <select id="nm-type">
          <option value="project">project — 진행 중인 작업·결정·제약</option>
          <option value="feedback">feedback — 작업 방식에 대한 지침</option>
          <option value="user">user — 사용자 역할·선호</option>
          <option value="reference">reference — 외부 링크·티켓</option>
        </select></label>
      </div>
      <label>설명 (한 줄 — MEMORY.md 인덱스에 들어가는 요약) <input id="nm-desc" autocomplete="off"></label>
      <p class="hint">frontmatter 템플릿으로 파일을 만들고 인덱스 줄을 추가한 뒤, 본문을 쓸 수 있게 편집기로 엽니다.</p>
      <div class="row right"><button value="cancel">취소</button><button value="ok" class="primary">만들고 편집</button></div>
    </form>
  </dialog>
  <dialog id="dlg-rename">
    <form method="dialog">
      <h3>이름 변경</h3>
      <label>새 이름 <input id="rename-name" autocomplete="off"></label>
      <p class="hint" id="rename-hint"></p>
      <div class="row right"><button value="cancel">취소</button><button value="ok">변경</button></div>
    </form>
  </dialog>
  <div id="ctx" class="ctx hidden"></div>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../node_modules/marked/lib/marked.umd.js"></script>
  <script src="mdansi.js"></script>
  <script src="app.js"></script>
  <script src="termlook.js"></script>
  <script src="select.js"></script>
  <script src="stats.js"></script>
  <script src="transcript.js"></script>
  <script src="chat.js"></script>
  <script src="browser.js"></script>
</body>
</html>
